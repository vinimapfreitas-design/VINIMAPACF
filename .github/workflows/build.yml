name: Build and commit dist

on:
  push:
    paths-ignore:
      - 'dist/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Gerar build de producao
        run: npm run build

      - name: Comitar pasta dist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist
          if git diff --cached --quiet; then
            echo "dist sem alteracoes - nada para comitar"
          else
            git commit -m "chore: build dist"
            git push origin HEAD || echo "Push pelo GitHub Actions ignorado (branch protegida ou restrição de commit direto)"
          fi
